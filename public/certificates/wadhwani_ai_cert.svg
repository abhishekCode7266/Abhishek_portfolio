<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="40%" stop-color="#f3e5ab"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#594002"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background with border frame -->
  <rect x="20" y="20" width="1160" height="810" rx="20" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="45" y="45" width="1110" height="760" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="58" y="58" width="1084" height="734" rx="10" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad)">
    <polygon points="45,45 85,45 45,85"/>
    <polygon points="1155,45 1115,45 1155,85"/>
    <polygon points="45,805 85,805 45,765"/>
    <polygon points="1155,805 1115,805 1155,765"/>
  </g>

  <!-- Organization Header -->
  <g transform="translate(600, 130)" text-anchor="middle">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#1e3a8a" letter-spacing="4">WADHWANI FOUNDATION</text>
    <text y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="3">NATIONAL SKILLS &amp; AI INITIATIVE</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 240)" text-anchor="middle">
    <text font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#475569">This is to proudly certify that</text>
    <text y="65" font-family="'Georgia', 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#0f172a">ABHISHEK SINGH YADAV</text>
    <line x1="-320" y1="90" x2="320" y2="90" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Course description -->
  <g transform="translate(600, 385)" text-anchor="middle">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#334155">has successfully completed the comprehensive professional curriculum in</text>
    <text y="50" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#1d4ed8">Fundamentals of Artificial Intelligence</text>
    <text y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#64748b" max-width="800">
      demonstrating proficiency in AI Principles, Machine Learning Algorithms, Python for AI,
    </text>
    <text y="115" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#64748b">
      Data Preprocessing, Neural Network Fundamentals, and Applied Project Problem Solving.
    </text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(600, 620)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="62" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="54" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
    <text y="-12" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="900" fill="#594002" letter-spacing="1">OFFICIAL</text>
    <text y="6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#3b2b00" letter-spacing="2">VERIFIED</text>
    <text y="24" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#594002">CREDENTIAL</text>
    <!-- Ribbon tails -->
    <path d="M-25,50 L-35,110 L-10,95 L15,110 L5,50 Z" fill="#b45309" opacity="0.85"/>
    <path d="M5,50 L-5,110 L20,95 L45,110 L35,50 Z" fill="#d97706" opacity="0.85"/>
  </g>

  <!-- Signatures and Details -->
  <g transform="translate(220, 680)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text y="24" font-family="'Georgia', serif" font-size="18" font-style="italic" fill="#0f172a">Academic Director</text>
    <text y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">Wadhwani Foundation</text>
    <text y="70" font-family="'Courier New', monospace" font-size="12" fill="#475569">Date: 18/JULY/2026</text>
  </g>

  <g transform="translate(760, 680)">
    <line x1="0" y1="0" x2="220" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text y="24" font-family="'Georgia', serif" font-size="18" font-style="italic" fill="#0f172a">Program Coordinator</text>
    <text y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b">Skills Development Board</text>
    <text y="70" font-family="'Courier New', monospace" font-size="12" fill="#475569">ID: WF-AI-2026-7266</text>
  </g>

  <!-- Security Footer Badge -->
  <g transform="translate(600, 785)" text-anchor="middle">
    <text font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" letter-spacing="1">
      Verify at: https://www.wadhwanifoundation.org • AKTU Affiliated LDC Institute
    </text>
  </g>
</svg>
